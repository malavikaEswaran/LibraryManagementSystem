<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📚 Library Management System</h1>
    <p>CRUD-Based Web Application</p>
  </header>

  <main>
    <section class="card">
      <h2 id="formTitle">Add Book</h2>
      <form id="bookForm">
        <input type="hidden" id="bookId">

        <label>Book Title</label>
        <input id="title" type="text" required>

        <label>Author</label>
        <input id="author" type="text" required>

        <label>Category</label>
        <input id="category" type="text" required>

        <label>ISBN</label>
        <input id="isbn" type="text" required>

        <label>Total Quantity</label>
        <input id="quantity" type="number" min="1" required>

        <label>Available Quantity</label>
        <input id="availableQuantity" type="number" min="0" required>

        <div class="buttons">
          <button type="submit">Save Book</button>
          <button type="button" class="secondary" onclick="resetForm()">Clear</button>
        </div>
      </form>
      <p id="message"></p>
    </section>

    <section class="card">
      <div class="list-header">
        <h2>Books</h2>
        <input id="search" type="text" placeholder="Search title, author or category..." oninput="displayBooks()">
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Author</th>
              <th>Category</th>
              <th>ISBN</th>
              <th>Quantity</th>
              <th>Available</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="bookTable"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
